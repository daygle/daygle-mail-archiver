version: 2

# Dependency update policy for this project.
#
# Pip: each service pins its own requirements file (api/, worker/). The dev
# requirements at the repo root pull in api/requirements.txt via `-r`, so it is
# deliberately not listed here to avoid duplicate PRs for the same packages.
# Docker: Dependabot's docker ecosystem only parses Dockerfiles and Kubernetes
# manifests, so it is configured per service directory (api/, worker/). The
# postgres and clamav image tags pinned in docker-compose.yml are not visible to
# Dependabot and have to be bumped by hand; check_base_images.py compares them
# with Docker Hub and runs weekly in .github/workflows/base-images.yml.
# GitHub Actions: keeps the action versions used in CI current.
updates:
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    commit-message:
      prefix: "pip(api)"

  - package-ecosystem: pip
    directory: /worker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    commit-message:
      prefix: "pip(worker)"

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: "docker(api)"

  - package-ecosystem: docker
    directory: /worker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: "docker(worker)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"