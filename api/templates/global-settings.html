{% extends "base.html" %}
{% block page_title %}{{ gettext('Global Settings') }}{% endblock %}

{% block content %}
<form method="post">

<!-- ================= GENERAL ================= -->
<div class="card mb-4">
    <div class="card-header"><i class="fas fa-cog"></i> {{ gettext('General Settings') }}</div>
    <div class="card-body">
        <div class="row g-3">

            <div class="col-md-4">
                <label class="form-label">{{ gettext('Items Per Page') }}</label>
                <input class="form-control" type="number" name="page_size" value="{{ settings.page_size or 50 }}" min="10" max="500">
            </div>

            <div class="col-md-4">
                <label class="form-label">{{ gettext('Date Format') }}</label>
                <select class="form-select" name="date_format">
                    <option value="%d/%m/%Y" {{ 'selected' if settings.date_format == '%d/%m/%Y' else '' }}>15/01/2024</option>
                    <option value="%Y-%m-%d" {{ 'selected' if settings.date_format == '%Y-%m-%d' else '' }}>2024-01-15</option>
                    <option value="%m/%d/%Y" {{ 'selected' if settings.date_format == '%m/%d/%Y' else '' }}>01/15/2024</option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label">{{ gettext('Time Format') }}</label>
                <select class="form-select" name="time_format">
                    <option value="%H:%M" {{ 'selected' if settings.time_format == '%H:%M' else '' }}>24 Hour</option>
                    <option value="%I:%M %p" {{ 'selected' if settings.time_format == '%I:%M %p' else '' }}>12 Hour</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">{{ gettext('Timezone') }}</label>
                <select class="form-select" name="timezone">
                    <option value="Australia/Melbourne" selected>Australia/Melbourne (AEST)</option>
                    <option value="Australia/Sydney">Australia/Sydney</option>
                    <option value="UTC">UTC</option>
                    <option value="Europe/London">Europe/London</option>
                    <option value="America/New_York">America/New York</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">{{ gettext('Default Theme') }}</label>
                <select class="form-select" name="default_theme">
                    <option value="system">System</option>
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label">{{ gettext('Auto Logout (minutes)') }}</label>
                <input class="form-control" type="number" name="auto_logout_minutes" value="{{ settings.auto_logout_minutes or 60 }}">
            </div>
        </div>
    </div>
</div>

<!-- ================= RETENTION ================= -->
<div class="card mb-4">
    <div class="card-header"><i class="fas fa-clock"></i> {{ gettext('Email Retention') }}</div>
    <div class="card-body">

        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" name="enable_purge" {{ 'checked' if settings.enable_purge=='true' else '' }}>
            <label class="form-check-label">{{ gettext('Enable Automatic Purging') }}</label>
        </div>

        <div class="row g-3">
            <div class="col-md-3">
                <input class="form-control" type="number" name="retention_value" value="{{ settings.retention_value or 1 }}">
            </div>
            <div class="col-md-3">
                <select class="form-select" name="retention_unit">
                    <option value="days">Days</option>
                    <option value="months">Months</option>
                    <option value="years">Years</option>
                </select>
            </div>
        </div>
    </div>
</div>

<!-- ================= SMTP ================= -->
<div class="card mb-4">
    <div class="card-header d-flex justify-content-between">
        <span><i class="fas fa-envelope"></i> SMTP</span>
        <div id="smtp-test-container"></div>
    </div>
    <div class="card-body">

        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="smtp_enabled" name="smtp_enabled" {{ 'checked' if settings.smtp_enabled=='true' else '' }}>
            <label class="form-check-label">Enable Email Alerts</label>
        </div>

        <div class="row g-3">
            <div class="col-md-4"><input class="form-control" name="smtp_host" placeholder="smtp.example.com"></div>
            <div class="col-md-2"><input class="form-control" name="smtp_port" value="587"></div>
            <div class="col-md-6"><input class="form-control" name="smtp_from_email"></div>
        </div>
    </div>
</div>

<div class="text-end">
    <a href="/dashboard" class="btn btn-secondary">Cancel</a>
    <button type="submit" class="btn btn-primary">Save Settings</button>
</div>

</form>

<!-- Test SMTP -->
<form method="post" action="/api/test-smtp" id="smtp-test-form" style="display:none;">
    <button class="btn btn-info" id="smtp-test-btn">Send Test Email</button>
</form>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const box = document.getElementById('smtp-test-container');
    const form = document.getElementById('smtp-test-form');
    const chk = document.getElementById('smtp_enabled');
    box.appendChild(form);
    form.style.display = 'inline-block';

    chk.addEventListener('change', ()=> {
        document.getElementById('smtp-test-btn').disabled = !chk.checked;
    });
});
</script>

{% endblock %}
