{% extends "base.html" %}

{% block page_title %}Access Denied{% endblock %}

{% block content %}
<div class="den-page">
    <div class="den-card">
        <div class="den-icon"><i class="fas fa-lock"></i></div>
        <div class="den-eyebrow"><i class="fas fa-exclamation-triangle"></i> 403 - Access denied</div>
        <h2>You don't have permission to view this page</h2>
        <p>If you believe this is an error, please contact your administrator.</p>
        <a href="/dashboard" class="btn btn-primary">
            <i class="fas fa-home"></i><span>Go to Dashboard</span>
        </a>
    </div>
</div>
{% endblock %}

{% block extra_css %}<link rel="stylesheet" href="/static/access-denied.css">{% endblock %}
