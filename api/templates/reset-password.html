<!DOCTYPE html>
<html data-theme="light">
<head>
    <title>Reset Password - Daygle Mail Archiver</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="/static/daygle.png">
    <style>/* Critical inline to prevent FOUC */ .auth-card, .auth-container{visibility:hidden}</style>
    <link rel="stylesheet" href="/static/vendor/fontawesome/all.min.css">
    <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <img id="logo" src="/static/daygle.png" alt="Daygle" class="auth-logo">
                <h1 class="auth-title">{{ gettext("Reset Password") }}</h1>
                <p class="auth-subtitle">{{ gettext("Enter your new password below") }}</p>
                <div style="position:relative; margin-top:8px;">
                    <div class="auth-lang-picker" style="position:fixed; right:60px; top:12px;">
                        <button id="authLangToggle" class="auth-lang-toggle" title="{{ gettext('Language') }}"><span id="authLangFlag">{% if request.session.get('language') == 'en' %}🇬🇧{% elif request.session.get('language') == 'es' %}🇪🇸{% elif request.session.get('language') == 'fr' %}🇫🇷{% elif request.session.get('language') == 'de' %}🇩🇪{% elif request.session.get('language') == 'zh' %}🇨🇳{% else %}�🇧{% endif %}</span></button>
                        <div id="authLangPopup" class="auth-lang-popup" style="left:0; top:44px;">
                            <button data-lang="en"><span class="flag">🇬🇧</span>&nbsp;{{ gettext('English') }}</button>
                            <button data-lang="es"><span class="flag">🇪🇸</span>&nbsp;{{ gettext('Español') }}</button>
                            <button data-lang="fr"><span class="flag">🇫🇷</span>&nbsp;{{ gettext('Français') }}</button>
                            <button data-lang="de"><span class="flag">🇩🇪</span>&nbsp;{{ gettext('Deutsch') }}</button>
                            <button data-lang="zh"><span class="flag">🇨🇳</span>&nbsp;{{ gettext('中文') }}</button>
                        </div>
                    </div>
                </div>
            </div>

            <form method="post" class="auth-form">
                <input type="hidden" name="token" value="{{ token }}">


                <div class="form-group">
                    <label for="password" class="form-label">{{ gettext('New Password') }}</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="{{ gettext('Enter your new password') }}" autocomplete="new-password" required>
                    <div class="form-text">
                        {{ gettext('Password must be at least 8 characters long and contain uppercase, lowercase, and numeric characters.') }}
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm_password" class="form-label">{{ gettext('Confirm New Password') }}</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="{{ gettext('Confirm your new password') }}" autocomplete="new-password" required>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-key"></i>
                    <span>{{ gettext('Reset Password') }}</span>
                </button>
            </form>

            <div class="auth-links">
                <a href="/login" class="auth-link">
                    <i class="fas fa-arrow-left"></i>
                    {{ gettext('Back to Login') }}
                </a>
            </div>
        </div>
    </div>

    <script>
        // Theme detection from localStorage
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <style>
        .auth-page-theme-toggle { position: absolute; right: 60px; top: 12px; }
        .auth-lang-picker { position: absolute; right: 16px; top: 12px; }
        .auth-lang-toggle{ width:34px; height:34px; border-radius:50%; border:none; background:var(--bg-elevated); display:flex; align-items:center; justify-content:center; }
        .auth-lang-popup{ position:absolute; background:var(--bg-elevated); border-radius:8px; padding:6px; box-shadow:0 6px 18px rgba(0,0,0,0.12); display:flex; flex-direction:column; gap:6px; }
    </style>

    <!-- Bootstrap JS -->
    <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script>
        (function(){
            var sel = document.getElementById('language');
            if(!sel) return;
            sel.addEventListener('change', function(){
                try{
                    var url = new URL(window.location.href);
                    url.searchParams.set('lang', this.value);
                    window.location.href = url.toString();
                }catch(e){ location.reload(); }
            });
        })();
    </script>
    <script>
        (function(){
            var flash = null;
            {% if error %}
            flash = {{ {"message": error, "type": "error"}|tojson }};
            {% elif success %}
            flash = {{ {"message": success, "type": "success"}|tojson }};
            {% endif %}
            if(flash){ window.__initialFlash = flash; }
        })();
    </script>
    <script src="/static/js/toast.js"></script>

    <script>
        // Auth page language picker behavior (reset-password)
        (function(){
            try {
                const toggle = document.getElementById('authLangToggle');
                const popup = document.getElementById('authLangPopup');
                const flag = document.getElementById('authLangFlag');

                if (!toggle || !popup) return;

                const currentLang = "{{ request.session.get('language', 'en') }}";
                const flags = { en: '🇬🇧', es: '🇪🇸', fr: '🇫🇷', de: '🇩🇪', zh: '🇨🇳' };
                if (flag) flag.textContent = flags[currentLang] || '🌐';

                // Toggle popup
                toggle.addEventListener('click', function(e){
                    e.stopPropagation();
                    popup.classList.toggle('open');
                });

                // Select language - navigate with ?lang=xx to set session
                popup.querySelectorAll('button[data-lang]').forEach(btn => {
                    btn.addEventListener('click', function(){
                        const lang = this.getAttribute('data-lang');
                        try{
                            const url = new URL(window.location.href);
                            url.searchParams.set('lang', lang);
                            window.location.href = url.toString();
                        }catch(e){ location.reload(); }
                    });
                });

                // Close popup when clicking outside
                document.addEventListener('click', function(e){
                    if (!popup.contains(e.target) && e.target !== toggle) {
                        popup.classList.remove('open');
                    }
                });

            } catch (e) {
                console.error('Auth language picker failed:', e);
            }
        })();
        // Reveal auth content after styles are loaded to reduce FOUC
        function revealAuth(){
            try{
                var auths = document.querySelectorAll('.auth-card, .auth-container');
                for(var i=0;i<auths.length;i++) auths[i].classList.add('visible');
            }catch(e){/* ignore */}
        }
        window.addEventListener('load', function(){ setTimeout(revealAuth, 50); });
        if (document.readyState === 'complete') { setTimeout(revealAuth, 50); }

        // Update logo based on theme
        (function(){
            const theme = document.documentElement.getAttribute('data-theme') || 'light';
            const logo = document.getElementById('logo');
            if (theme === 'dark') {
                logo.src = '/static/daygle-light.png';
            } else {
                logo.src = '/static/daygle.png';
            }
        })();

        // Global error handler for auth pages
        function showAuthError(msg){
            try{
                if(window.createToast){
                    window.createToast(msg, 'error');
                    return;
                }
                let container = document.querySelector('.auth-card');
                let err = container.querySelector('.auth-error');
                if(!err){
                    err = document.createElement('div');
                    err.className = 'auth-error';
                    err.innerHTML = '<i class="fas fa-exclamation-circle"></i><span></span>';
                    container.insertBefore(err, container.querySelector('.auth-form'));
                }
                err.querySelector('span').textContent = msg;
            }catch(e){
                console.error('Failed to show auth error:', e);
            }
        }

        window.addEventListener('error', function(ev){
            console.error('Global error on reset password page:', ev.error || ev.message, ev);
            const message = ev && ev.error && ev.error.message ? ev.error.message : (ev && ev.message) || 'An unexpected error occurred';
            showAuthError(message);
        });

        window.addEventListener('unhandledrejection', function(ev){
            console.error('Unhandled rejection on reset password page:', ev.reason);
            const message = (ev.reason && ev.reason.message) || (typeof ev.reason === 'string' ? ev.reason : 'An unexpected error occurred');
            showAuthError(message);
        });
    </script>
</body>
</html>
