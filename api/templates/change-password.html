{% extends "base.html" %}

{% block page_title %}Change Password{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <div class="card-title">
            <i class="fas fa-lock"></i>
            <span>{{ gettext("Change Password") }}</span>
        </div>
        <div style="margin-left:auto">
            {% set _lang = request.session.get('language', 'en') %}
            <select id="language" name="language" class="form-select" style="width:160px;">
                <option value="en" {% if _lang == 'en' %}selected{% endif %}>{{ gettext("English") }}</option>
                <option value="es" {% if _lang == 'es' %}selected{% endif %}>{{ gettext("Español") }}</option>
                <option value="fr" {% if _lang == 'fr' %}selected{% endif %}>{{ gettext("Français") }}</option>
                <option value="de" {% if _lang == 'de' %}selected{% endif %}>{{ gettext("Deutsch") }}</option>
                <option value="zh" {% if _lang == 'zh' %}selected{% endif %}>{{ gettext("中文") }}</option>
            </select>
        </div>
    </div>
    <div class="card-body">
        <form method="post" action="/profile/change-password">
            <div class="form-group">
                <label for="current_password" class="form-label">Current Password</label>
                <input id="current_password" class="form-control" name="current_password" type="password" placeholder="Enter your current password" autocomplete="current-password" required>
            </div>
            <div class="form-group mt-3">
                <label for="new_password" class="form-label">New Password</label>
                <input id="new_password" class="form-control" name="new_password" type="password" placeholder="Enter your new password" autocomplete="new-password" required>
            </div>
            <div class="form-group mt-3">
                <label for="confirm_password" class="form-label">Confirm New Password</label>
                <input id="confirm_password" class="form-control" name="confirm_password" type="password" placeholder="Confirm your new password" autocomplete="new-password" required>
            </div>
            <div style="display: flex; gap: 12px; margin-top: 24px; justify-content: flex-end;">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-key"></i>
                    <span>Change Password</span>
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
    (function(){
        var sel = document.getElementById('language');
        if(!sel) return;
        sel.addEventListener('change', function(){
            try{
                var body = 'language=' + encodeURIComponent(this.value);
                fetch('/set-language', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: body,
                    credentials: 'same-origin'
                }).then(function(){ location.reload(); }).catch(function(){ location.reload(); });
            }catch(e){ location.reload(); }
        });
    })();
</script>
{% endblock %}
