<!DOCTYPE html>
<html data-theme="light">
<head>
    <title>Forgot Password - Daygle Mail Archiver</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="/static/daygle.png">
    <link rel="stylesheet" href="/static/vendor/fontawesome/all.min.css">
    <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="/static/styles.css">
    <script>
        (function(){
            // Theme detection for auth pages
            var savedTheme = localStorage.getItem('theme') || 'system';
            var systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            var appliedTheme = savedTheme === 'system' ? systemTheme : savedTheme;
            document.documentElement.setAttribute('data-theme', appliedTheme);
        })();
    </script>
</head>
<body>
    <style>
        /* Hide language popup until toggled and match toggle size */
        .auth-lang-popup{ display:none; position:absolute; background:var(--bg-elevated); border-radius:8px; padding:6px; box-shadow:0 6px 18px rgba(0,0,0,0.12); flex-direction:column; gap:6px; }
        .auth-lang-popup.open{ display:flex; }
        .auth-lang-toggle{ width:34px; height:34px; border-radius:50%; border:none; background:var(--bg-elevated); display:flex; align-items:center; justify-content:center; font-size:16px; }
        .auth-page-theme-toggle{ width:34px; height:34px; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center; }
    </style>
    <button type="button" class="auth-page-theme-toggle" id="authThemeToggle" title="Toggle Theme">
        <i class="fas fa-sun" id="authThemeIconLight"></i>
        <i class="fas fa-moon" id="authThemeIconDark" style="display:none;"></i>
    </button>

    <div class="auth-container">
            <div class="auth-lang-picker" style="position:fixed; right:60px; top:12px;">
            <button id="authLangToggle" class="auth-lang-toggle" title="{{ gettext('Language') }}"><span id="authLangFlag">{% if request.session.get('language') == 'en' %}🇬🇧{% elif request.session.get('language') == 'es' %}🇪🇸{% elif request.session.get('language') == 'fr' %}🇫🇷{% elif request.session.get('language') == 'de' %}🇩🇪{% elif request.session.get('language') == 'zh' %}🇨🇳{% else %}�🇧{% endif %}</span></button>
            <div id="authLangPopup" class="auth-lang-popup" style="left:0; top:44px;">
                <button data-lang="en"><span class="flag">🇬🇧</span>&nbsp;{{ gettext('English') }}</button>
                <button data-lang="es"><span class="flag">🇪🇸</span>&nbsp;{{ gettext('Español') }}</button>
                <button data-lang="fr"><span class="flag">🇫🇷</span>&nbsp;{{ gettext('Français') }}</button>
                <button data-lang="de"><span class="flag">🇩🇪</span>&nbsp;{{ gettext('Deutsch') }}</button>
                <button data-lang="zh"><span class="flag">🇨🇳</span>&nbsp;{{ gettext('中文') }}</button>
            </div>
        </div>
        <div class="auth-card">
            <div class="auth-header">
                <img id="logo" src="/static/daygle.png" alt="Daygle" class="auth-logo">
                <h1 class="auth-title">{{ gettext("Forgot Password") }}</h1>
                <p class="auth-subtitle">{{ gettext("Enter your email address to reset your password or unlock your account") }}</p>
                {% set _lang = request.session.get('language', 'en') %}
                <div style="margin-top:8px;">
                    <select id="language" name="language" class="form-select" style="width:220px;">
                        <option value="en" {% if _lang == 'en' %}selected{% endif %}>{{ gettext("English") }}</option>
                        <option value="es" {% if _lang == 'es' %}selected{% endif %}>{{ gettext("Español") }}</option>
                        <option value="fr" {% if _lang == 'fr' %}selected{% endif %}>{{ gettext("Français") }}</option>
                        <option value="de" {% if _lang == 'de' %}selected{% endif %}>{{ gettext("Deutsch") }}</option>
                        <option value="zh" {% if _lang == 'zh' %}selected{% endif %}>{{ gettext("中文") }}</option>
                    </select>
                </div>
            </div>

            <form method="post" class="auth-form">
                <div class="form-group">
                    <label for="email" class="form-label">{{ gettext("Email Address") }}</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="{{ gettext('Enter your email address') }}" autocomplete="email" autofocus required>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-paper-plane"></i>
                    <span>{{ gettext('Send Reset Link') }}</span>
                </button>
            </form>

            <div class="auth-links">
                <a href="/login" class="auth-link">
                    <i class="fas fa-arrow-left"></i>
                    {{ gettext('Back to Login') }}
                </a>
            </div>
        </div>
    </div>

    <script>
        // Reveal auth content after styles are loaded to reduce FOUC
        function revealAuth(){
            try{
                var auths = document.querySelectorAll('.auth-card, .auth-container');
                for(var i=0;i<auths.length;i++) auths[i].classList.add('visible');
            }catch(e){/* ignore */}
        }
        // Reveal only after full load to ensure stylesheets are applied
        window.addEventListener('load', function(){ setTimeout(revealAuth, 50); });
        if (document.readyState === 'complete') { setTimeout(revealAuth, 50); }

        // Global error handler for auth pages - prefer to show toasts when available
        function showAuthError(msg){
            try{
                if(window.createToast){
                    window.createToast(msg, 'error');
                    return;
                }
                // fallback: insert inline error block
                let container = document.querySelector('.auth-card');
                let err = container.querySelector('.auth-error');
                if(!err){
                    err = document.createElement('div');
                    err.className = 'auth-error';
                    err.innerHTML = '<i class="fas fa-exclamation-circle"></i><span></span>';
                    container.insertBefore(err, container.querySelector('.auth-form'));
                }
                err.querySelector('span').textContent = msg;
            }catch(e){
                console.error('Failed to show auth error:', e);
            }
        }

        window.addEventListener('error', function(ev){
            console.error('Global error on setup page:', ev.error || ev.message, ev);
            const message = ev && ev.error && ev.error.message ? ev.error.message : (ev && ev.message) || 'An unexpected error occurred';
            showAuthError(message);
        });

        window.addEventListener('unhandledrejection', function(ev){
            console.error('Unhandled rejection on setup page:', ev.reason);
            const message = (ev.reason && ev.reason.message) || (typeof ev.reason === 'string' ? ev.reason : 'An unexpected error occurred');
            showAuthError(message);
        });

        // Theme toggle functionality for auth pages
        (function(){
            const themeToggle = document.getElementById('authThemeToggle');
            const lightIcon = document.getElementById('authThemeIconLight');
            const darkIcon = document.getElementById('authThemeIconDark');

            function updateThemeIcons(theme) {
                if (theme === 'dark') {
                    lightIcon.style.display = 'none';
                    darkIcon.style.display = 'inline';
                } else {
                    lightIcon.style.display = 'inline';
                    darkIcon.style.display = 'none';
                }
            }

            function updateLogo(theme) {
                const logo = document.getElementById('logo');
                if (theme === 'dark') {
                    logo.src = '/static/daygle-light.png';
                } else {
                    logo.src = '/static/daygle.png';
                }
            }

            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
                updateThemeIcons(theme);
                updateLogo(theme);
            }

            // Initialise theme icons
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
            updateThemeIcons(currentTheme);
            updateLogo(currentTheme);

            // Theme toggle click handler
            themeToggle.addEventListener('click', function() {
                const currentTheme = localStorage.getItem('theme') || 'system';
                let newTheme;

                if (currentTheme === 'light') {
                    newTheme = 'dark';
                } else if (currentTheme === 'dark') {
                    newTheme = 'system';
                } else {
                    newTheme = 'light';
                }

                applyTheme(newTheme);
            });

            // Listen for system theme changes
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
                const savedTheme = localStorage.getItem('theme') || 'system';
                if (savedTheme === 'system') {
                    const systemTheme = e.matches ? 'dark' : 'light';
                    applyTheme(systemTheme);
                }
            });
        })();
    </script>

    <!-- Bootstrap JS -->
    <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script>
        (function(){
            var sel = document.getElementById('language');
            if(!sel) return;
            sel.addEventListener('change', function(){
                try{
                    var url = new URL(window.location.href);
                    url.searchParams.set('lang', this.value);
                    window.location.href = url.toString();
                }catch(e){ location.reload(); }
            });
        })();
    </script>
    <script>
        (function(){
            var flash = null;
            {% if error %}
            flash = {{ {"message": error, "type": "error"}|tojson }};
            {% elif success %}
            flash = {{ {"message": success, "type": "success"}|tojson }};
            {% endif %}
            if(flash){ window.__initialFlash = flash; }
        })();
    </script>
    <script src="/static/js/toast.js"></script>
    <script>
        (function(){
            try {
                const toggle = document.getElementById('authLangToggle');
                const popup = document.getElementById('authLangPopup');
                const flag = document.getElementById('authLangFlag');

                if (!toggle || !popup) return;

                const currentLang = "{{ request.session.get('language', 'en') }}";
                const flags = { en: '🇬🇧', es: '🇪🇸', fr: '🇫🇷', de: '🇩🇪', zh: '🇨🇳' };
                if (flag) flag.textContent = flags[currentLang] || '🌐';

                // Toggle popup
                toggle.addEventListener('click', function(e){
                    e.stopPropagation();
                    popup.classList.toggle('open');
                });

                // Select language - navigate with ?lang=xx to set session
                popup.querySelectorAll('button[data-lang]').forEach(btn => {
                    btn.addEventListener('click', function(){
                        const lang = this.getAttribute('data-lang');
                        try{
                            const url = new URL(window.location.href);
                            url.searchParams.set('lang', lang);
                            window.location.href = url.toString();
                        }catch(e){ location.reload(); }
                    });
                });

                // Close popup when clicking outside
                document.addEventListener('click', function(e){
                    if (!popup.contains(e.target) && e.target !== toggle) {
                        popup.classList.remove('open');
                    }
                });

            } catch (e) {
                console.error('Auth language picker failed:', e);
            }
        })();
    </script>
</body>
</html>
